# Netlify-Deploy-Konfiguration für die Astro-Website
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Astro erzeugt bereits sauberе Trailing-Slash-URLs (trailingSlash: 'always').
# 404-Seite wird von Netlify automatisch aus dist/404.html bedient.

# ── Umfirmierung: alte Domain dauerhaft auf die neue ──────────
# Die Host-Angabe in `from` wertet Netlify mit aus, die Regeln greifen also
# nur fuer nordbau-haeuser.de und nicht fuer ecobau-hannover.com selbst.
# `force = true` ist noetig, weil sonst der vorhandene statische Treffer
# gewinnt und die Weiterleitung nie ausgeloest wird.
[[redirects]]
  from = "https://nordbau-haeuser.de/*"
  to = "https://ecobau-hannover.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.nordbau-haeuser.de/*"
  to = "https://ecobau-hannover.com/:splat"
  status = 301
  force = true

# ── Neustrukturierung 2026 ───────────────────────────────────
# Bewusst OHNE `force`: Die alten Seiten liegen nicht mehr im Build, die
# Weiterleitung greift also ohnehin. Mit `force` wuerden diese Regeln auch
# echte Dateien in denselben Pfaden schlucken – so sind unter /referenzen/
# liegende Bilder als HTML-Seite ausgeliefert worden statt als Bild.
# "Haustypen" heisst jetzt "Haeuser", Satteldach- und Flachdachhaus sind im
# Einfamilienhaus aufgegangen, das Mehrfamilienhaus ist in den Wohn- und
# Gewerbebau gewandert. Die alten Adressen sind teils indexiert, deshalb
# einzeln und dauerhaft weiterleiten statt pauschal auf die Startseite.
[[redirects]]
  from = "/haustypen/satteldachhaus/*"
  to = "/haeuser/einfamilienhaus/"
  status = 301

[[redirects]]
  from = "/haustypen/flachdachhaus/*"
  to = "/haeuser/einfamilienhaus/"
  status = 301

[[redirects]]
  from = "/haustypen/tiny-house/*"
  to = "/haeuser/tiny-haus/"
  status = 301

[[redirects]]
  from = "/haustypen/mehrfamilienhaus/*"
  to = "/wohn-und-gewerbebau/mehrfamilienhaeuser/"
  status = 301

[[redirects]]
  from = "/haustypen/bungalow/*"
  to = "/haeuser/bungalow/"
  status = 301

[[redirects]]
  from = "/haustypen/modulhaus/*"
  to = "/haeuser/modulhaus/"
  status = 301

[[redirects]]
  from = "/haustypen/*"
  to = "/haeuser/einfamilienhaus/"
  status = 301

# Die Referenzseite ist entfallen; die Projekte stehen jetzt im Katalog der
# jeweiligen Haus- und Bauart.
[[redirects]]
  from = "/referenzen/*"
  to = "/haeuser/einfamilienhaus/"
  status = 301

# Hoch- und Tiefbau ist im Wohn- und Gewerbebau aufgegangen.
[[redirects]]
  from = "/hoch-und-tiefbau/*"
  to = "/wohn-und-gewerbebau/gewerbebau/"
  status = 301

[[redirects]]
  from = "/bauleistungen/*"
  to = "/wohn-und-gewerbebau/gewerbebau/"
  status = 301

# /ablauf/ ist durch die ausfuehrliche Ablaufseite ersetzt worden.
[[redirects]]
  from = "/ablauf/*"
  to = "/weg-zum-traumhaus/"
  status = 301

